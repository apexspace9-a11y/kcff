plugins {
    id 'com.android.application'
}

android {
    namespace 'com.apex.ffy9booster'
    compileSdk 35

    defaultConfig {
        applicationId 'com.apex.ffy9booster'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
}
