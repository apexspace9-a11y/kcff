name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Validate image assets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          checked = 0
          for path in Path('app/src/main/res').rglob('*'):
              if not path.is_file():
                  continue
              suffix = path.suffix.lower()
              if suffix not in {'.webp', '.png', '.jpg', '.jpeg'}:
                  continue

              data = path.read_bytes()
              if suffix == '.webp':
                  if len(data) < 12 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                      raise SystemExit(f'Invalid WEBP header: {path}')
                  declared = int.from_bytes(data[4:8], 'little') + 8
                  if declared != len(data):
                      raise SystemExit(
                          f'Truncated WEBP: {path} declares {declared} bytes but has {len(data)}'
                      )
              elif suffix == '.png':
                  if not data.startswith(b'\x89PNG\r\n\x1a\n'):
                      raise SystemExit(f'Invalid PNG header: {path}')
              else:
                  if len(data) < 4 or not data.startswith(b'\xff\xd8') or not data.endswith(b'\xff\xd9'):
                      raise SystemExit(f'Invalid JPEG: {path}')
              checked += 1

          print(f'Validated {checked} raster image asset(s).')
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk KCFF.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KCFF-apk
          path: KCFF.apk
          if-no-files-found: error
          retention-days: 14
