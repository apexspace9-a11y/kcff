name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk KCFF.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KCFF-apk
          path: KCFF.apk
          if-no-files-found: error
          retention-days: 14
